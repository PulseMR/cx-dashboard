<style>
:root { --bg: #f6f7f9; --surface: #fff; --ink: #1a1d21; --muted: #5f6670; --line: #d9dde3; --accent: #1c5cab; --bad: #c62828; color-scheme: light; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #0e0f11; --surface: #1a1c1f; --ink: #eceef1; --muted: #9aa1ab; --line: #30343a; --accent: #5b9be6; --bad: #ef6b6b; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #0e0f11; --surface: #1a1c1f; --ink: #eceef1; --muted: #9aa1ab; --line: #30343a; --accent: #5b9be6; --bad: #ef6b6b; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
form { width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 28px 24px; }
h1 { font-size: 20px; margin: 0 0 4px; }
p { margin: 0 0 18px; color: var(--muted); }
input[type=password] { width: 100%; padding: 10px 12px; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; }
input[type=password]:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
label { display: flex; gap: 8px; align-items: center; margin: 12px 0 18px; color: var(--muted); font-size: 14px; }
button { width: 100%; padding: 10px; font: inherit; font-weight: 600; color: #fff; background: var(--accent); border: 0; border-radius: 8px; cursor: pointer; }
button:disabled { opacity: .6; cursor: wait; }
#msg { min-height: 1.5em; margin: 12px 0 0; font-size: 14px; }
#msg.bad { color: var(--bad); }
</style>

const KEY = "cxdash-key-" + E.id;
const $ = id => document.getElementById(id);
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const msg = (t, bad) => { $("msg").textContent = t; $("msg").className = bad ? "bad" : ""; };
const store = {
  get() { try { return localStorage.getItem(KEY); } catch (e) { return null; } },
  set(v) { try { localStorage.setItem(KEY, v); } catch (e) {} },
  del() { try { localStorage.removeItem(KEY); } catch (e) {} },
};
try { const t = localStorage.getItem("cxdash-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}

async function derive(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({ name: "PBKDF2", salt: b64(E.salt), iterations: E.iter, hash: "SHA-256" }, base, 256));
}
// throws on a wrong key (AES-GCM authenticates the content)
async function decrypt(raw) {
  const key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
  const gz = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(E.iv) }, key, b64(E.ct));
  return new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
}
function show(html) { document.open(); document.write(html); document.close(); }

const saved = store.get();
if (saved) decrypt(b64(saved)).then(show, () => { store.del(); msg("The password has changed. Please enter the new password.", true); });

$("f").onsubmit = async e => {
  e.preventDefault();
  $("go").disabled = true;
  msg("Opening…");
  try {
    const raw = await derive($("pw").value.trim());
    const html = await decrypt(raw);
    if ($("rem").checked) store.set(btoa(String.fromCharCode(...raw)));
    show(html);
  } catch (x) {
    msg("Wrong password.", true);
    $("go").disabled = false;
    $("pw").select();
  }
};
})();
</script>
